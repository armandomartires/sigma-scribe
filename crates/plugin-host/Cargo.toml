[package]
name = "sigma-plugin-host"
description = "Runs Sigma Scribe screen plugins (WASM) with limits and a disk cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
sigma-core = { path = "../core" }
sigma-plugin-api = { path = "../plugin-api" }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "auto-dispatch"] }

[dev-dependencies]
wat = "1"

[lints]
workspace = true
