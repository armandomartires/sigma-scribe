[package]
name = "sigma-plugin-host"
description = "Runs Sigma Scribe screen plugins (WASM) with limits and a disk cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
sigma-core = { path = "../core" }
sigma-plugin-api = { path = "../plugin-api" }
# portable-dispatch: a plain loop, so stack use never depends on the compiler
# turning tail calls into jumps (auto-dispatch overflowed the stack in some
# build configurations). About 2.7x slower; see docs/plugins.md.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }

[dev-dependencies]
wat = "1"

[lints]
workspace = true
