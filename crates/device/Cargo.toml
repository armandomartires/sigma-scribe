[package]
name = "sigma-device"
description = "Device layer for Σscribe: trait, desktop PNG emulator, Kobo FBInk + evdev backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[dependencies]
sigma-render = { path = "../render" }
sigma-core = { path = "../core" }
png.workspace = true

[build-dependencies]
cc = "1"

# FFI to FBInk needs `unsafe`; it is confined to src/fbink.rs.
# A package `[lints]` table cannot both inherit the workspace table and
# override it, so this crate restates the workspace lints. Keep the clippy
# table in step with `[workspace.lints.clippy]` in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
