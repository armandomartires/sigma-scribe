[package]
name = "sigma-render"
description = "Software renderer and screens for Σscribe (8-bit greyscale canvas, Literata/Atkinson)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
sigma-hwr = { path = "../hwr" }
sigma-core = { path = "../core" }
sigma-plugin-api = { path = "../plugin-api" }
harfrust = "0.15"
skrifa = "0.49"
zeno = "0.3"
# v1.5.1: ink SVGs drawn in preview (same version as the icon bake).
resvg = { version = "0.45", default-features = false }
unicode-bidi = "0.3"
unicode-properties = "0.1"
qrcodegen = "1.8"

[lints]
workspace = true

# v1.1: Lucide SVG icons are baked into greyscale masks at build time.
[build-dependencies]
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
rqrr = { version = "0.11", default-features = false }
