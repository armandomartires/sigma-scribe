# cargo-deny: checks the locked dependencies (`cargo deny check`).
# Run in CI by the `deny` job. See CONTRIBUTING.md.

[graph]
# Only the targets we build: the desktop and the Kobo.
targets = [
    "x86_64-unknown-linux-gnu",
    "armv7-unknown-linux-musleabihf",
]

[advisories]
# Fail on any RustSec advisory (vulnerable, unmaintained, unsound, yanked).
# To accept one, add it here with a reason:
# { id = "RUSTSEC-YYYY-NNNN", reason = "..." }
ignore = []

[licenses]
# Permissive licences compatible with the project's AGPL-3.0-only.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    # yoke and zerofrom (used by harfrust and skrifa); permissive and
    # GPL-compatible.
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Our own crates are publish = false and AGPL-3.0-only.
ignore = true

[bans]
# Duplicate versions come from upstream (bitflags, miniz_oxide); report
# them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
