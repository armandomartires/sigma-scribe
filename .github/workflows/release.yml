name: release
# Builds the Kobo package exactly as a release ships it (pinned FBInk, the
# same container as ci.yml), checks it and uploads it as an artifact on
# every PR and push to main (release candidate). On a v* tag pushed by the
# maintainer it also creates a DRAFT GitHub Release; publishing the draft
# is a manual step (docs/release/checklist.md). This workflow never creates
# tags and never publishes.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    container: ghcr.io/rust-cross/rust-musl-cross:armv7-musleabihf
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Tools
        run: |
          (command -v git && command -v file) || (apt-get update && apt-get install -y git file)
          T=$HOME/.local/toolchains/armv7l-linux-musleabihf-cross/bin
          mkdir -p "$T"
          for f in $(ls "$(dirname "$(command -v armv7-unknown-linux-musleabihf-gcc)")" | grep '^armv7-unknown-linux-musleabihf-'); do
            ln -sf "$(command -v "$f")" "$T/armv7l-linux-musleabihf-${f#armv7-unknown-linux-musleabihf-}"
          done
          rustup target add armv7-unknown-linux-musleabihf || true
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v${{ steps.ver.outputs.version }}"
      - name: FBInk (pinned)
        run: |
          git config --global --add safe.directory '*'
          git clone --recursive https://github.com/NiLuJe/FBInk $HOME/src/FBInk
          cd $HOME/src/FBInk && git checkout 886f25f1 && git submodule update --init --recursive
          PATH=$HOME/.local/toolchains/armv7l-linux-musleabihf-cross/bin:$PATH make staticlib MINIMAL=true IMAGE=true KOBO=true CROSS_TC=armv7l-linux-musleabihf
      - name: Package and check
        run: ./scripts/package-kobo.sh
      - name: Hashes
        run: |
          V=${{ steps.ver.outputs.version }}
          sha256sum dist/sigma-scribe-$V-kobo.tar.gz > dist/sigma-scribe-$V-kobo.tar.gz.sha256
          cat dist/sigma-scribe-$V-kobo.tar.gz.sha256 dist/sigma-scribe-$V-kobo.sha256 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-scribe-${{ steps.ver.outputs.version }}-kobo
          path: |
            dist/sigma-scribe-${{ steps.ver.outputs.version }}-kobo.tar.gz
            dist/sigma-scribe-${{ steps.ver.outputs.version }}-kobo.tar.gz.sha256
            dist/sigma-scribe-${{ steps.ver.outputs.version }}-kobo.sha256
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sigma-scribe-${{ needs.package.outputs.version }}-kobo
          path: dist
      - name: Draft release (not published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.package.outputs.version }}
          gh release create "v$V" --draft --verify-tag \
            --title "Σscribe $V for Kobo Forma" \
            --notes-file "docs/release/v$V-notes.md" \
            dist/sigma-scribe-$V-kobo.tar.gz dist/sigma-scribe-$V-kobo.tar.gz.sha256 dist/sigma-scribe-$V-kobo.sha256
