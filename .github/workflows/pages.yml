# Publishes the project page (site/) on GitHub Pages, with the help centre
# built from docs/user/ under /help/. The screenshots are not stored in site/:
# they are copied in at build time from docs/screenshots/.
name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "docs/user/**"
      - "scripts/help-build.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the help pages show each file's last-changed date
      - name: Assemble _site
        run: |
          set -eu
          rm -rf _site
          mkdir -p _site/screenshots
          cp -r site/. _site/
          rm -f _site/README.md
          for f in docs/screenshots/readme/readme-*.png; do
            b=$(basename "$f"); cp "$f" "_site/screenshots/${b#readme-}"
          done
          missing=0
          for img in $(grep -o 'src="screenshots/[^"]*"' _site/index.html | sed 's/^src="//; s/"$//'); do
            if [ ! -f "_site/$img" ]; then
              echo "missing image: $img" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
      - name: Build the help centre into _site/help
        run: |
          set -eu
          pip install markdown==3.7
          python3 scripts/help-build.py docs/user _site/help
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
