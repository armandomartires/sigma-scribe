name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Handwriting figures (held-out accuracy, word-mode gate, latency)
        run: cargo test -q -p hwr-train --tests -- --nocapture
      - name: Emulator scripts
        run: rm -rf target/ci-notes target/ci-shots; for s in tests/emu/*.script; do cargo run -q --release --bin sigma-emu -- --script "$s" --shots target/ci-shots --notes "target/ci-notes/$(basename "$s")"; done
  armv7:
    runs-on: ubuntu-latest
    needs: test
    # musl.cc refuses GitHub runners, so the ARM musl gcc comes from this image
    # (armv7-unknown-linux-musleabihf-*), aliased to the musl.cc names the
    # build script and FBInk's CROSS_TC expect.
    container: ghcr.io/rust-cross/rust-musl-cross:armv7-musleabihf
    steps:
      - name: Tools
        run: |
          (command -v git && command -v file) || (apt-get update && apt-get install -y git file)
          T=$HOME/.local/toolchains/armv7l-linux-musleabihf-cross/bin
          mkdir -p "$T"
          for f in $(ls "$(dirname "$(command -v armv7-unknown-linux-musleabihf-gcc)")" | grep '^armv7-unknown-linux-musleabihf-'); do
            ln -sf "$(command -v "$f")" "$T/armv7l-linux-musleabihf-${f#armv7-unknown-linux-musleabihf-}"
          done
          ls "$T"
          rustup target add armv7-unknown-linux-musleabihf || true
      - uses: actions/checkout@v4
      - name: FBInk (pinned)
        run: |
          git config --global --add safe.directory '*'
          git clone --recursive https://github.com/NiLuJe/FBInk $HOME/src/FBInk
          cd $HOME/src/FBInk && git checkout 886f25f1 && git submodule update --init --recursive
          PATH=$HOME/.local/toolchains/armv7l-linux-musleabihf-cross/bin:$PATH make staticlib MINIMAL=true IMAGE=true KOBO=true CROSS_TC=armv7l-linux-musleabihf
      - name: Build static ARMv7 binary
        run: ./scripts/build-armv7.sh
      - run: file target/armv7-unknown-linux-musleabihf/release/sigma-scribe | grep -q "statically linked"
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-scribe-armv7
          path: target/armv7-unknown-linux-musleabihf/release/sigma-scribe
