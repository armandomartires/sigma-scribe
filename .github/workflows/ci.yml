name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable as of 2026-11-17
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs (broken links, and missing docs in the crates that require them)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace --locked
      - name: Handwriting figures (held-out accuracy, word-mode gate, latency)
        run: cargo test -q -p hwr-train --tests --locked -- --nocapture
      - name: Emulator scripts
        run: rm -rf target/ci-notes target/ci-shots; for s in tests/emu/*.script; do cargo run -q --release --locked --bin sigma-emu -- --script "$s" --shots target/ci-shots --notes "target/ci-notes/$(basename "$s")" || exit 1; done
  msrv:
    # Checks the minimum Rust version, `rust-version` in Cargo.toml.
    # Keep the toolchain below equal to that value.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable as of 2026-11-17
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo check --workspace --all-targets --locked
  deny:
    # Checks the locked dependencies against deny.toml: RustSec advisories,
    # licences, banned crates and sources. A new advisory can appear without
    # any change here, so it does not block the pull request; the other
    # checks do.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks: [advisories, bans licenses sources]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check ${{ matrix.checks }}
  armv7:
    runs-on: ubuntu-latest
    needs: test
    # musl.cc refuses GitHub runners, so the ARM musl gcc comes from this image
    # (armv7-unknown-linux-musleabihf-*), aliased to the musl.cc names the
    # build script and FBInk's CROSS_TC expect.
    container: ghcr.io/rust-cross/rust-musl-cross:armv7-musleabihf@sha256:dd494898259cf6981f9832bfd4437ddfc8393605164b3c242e4efe8a6bc30dfb
    steps:
      - name: Tools
        run: |
          (command -v git && command -v file) || (apt-get update && apt-get install -y git file)
          T=$HOME/.local/toolchains/armv7l-linux-musleabihf-cross/bin
          mkdir -p "$T"
          for f in $(ls "$(dirname "$(command -v armv7-unknown-linux-musleabihf-gcc)")" | grep '^armv7-unknown-linux-musleabihf-'); do
            ln -sf "$(command -v "$f")" "$T/armv7l-linux-musleabihf-${f#armv7-unknown-linux-musleabihf-}"
          done
          ls "$T"
          rustup target add armv7-unknown-linux-musleabihf || true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: FBInk (pinned)
        run: |
          git config --global --add safe.directory '*'
          git clone --recursive https://github.com/NiLuJe/FBInk $HOME/src/FBInk
          cd $HOME/src/FBInk && git checkout 886f25f13368859ad8a899b88d04c26e19cda32e && git submodule update --init --recursive
          PATH=$HOME/.local/toolchains/armv7l-linux-musleabihf-cross/bin:$PATH make staticlib MINIMAL=true IMAGE=true KOBO=true CROSS_TC=armv7l-linux-musleabihf
      - name: Build static ARMv7 binary
        run: ./scripts/build-armv7.sh
      - run: file target/armv7-unknown-linux-musleabihf/release/sigma-scribe | grep -q "statically linked"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sigma-scribe-armv7
          path: target/armv7-unknown-linux-musleabihf/release/sigma-scribe
