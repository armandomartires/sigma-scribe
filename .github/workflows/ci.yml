name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  armv7:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: Build static ARMv7 binary
        env:
          CC_armv7_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc
        run: cargo build --release --target armv7-unknown-linux-musleabihf -p kobo-sigma-scribe
      - run: file target/armv7-unknown-linux-musleabihf/release/sigma-scribe | grep -q "statically linked"
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-scribe-armv7
          path: target/armv7-unknown-linux-musleabihf/release/sigma-scribe
