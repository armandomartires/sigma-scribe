# GitLab CI for Σscribe (plan items P1-03 and P1-05, decision D5).
#
# These jobs are the canonical gates. The GitHub Actions workflows in
# .github/workflows/ are kept until P1-04, after this pipeline has been
# green on main. Pages and tagged releases stay on GitHub for now.
#
# Images are pinned by Docker Hub *manifest* digest, recorded 2026-11-17
# (Europe/London). rust-toolchain.toml pins the same stable (1.100.0);
# the MSRV job uses 1.88.0 from workspace.package.rust-version. To bump
# stable, update rust-toolchain.toml, RUST_IMAGE (tag digest from
# https://hub.docker.com/v2/repositories/library/rust/tags/1.XXX.0-bookworm),
# RUSTUP_TOOLCHAIN, and the cache prefixes together. To bump the MSRV,
# change rust-version, MSRV_IMAGE, and CONTRIBUTING.md together.
# scripts/check-ci-pins.py fails the pipeline if those drift, or if a
# cargo compile step drops --locked (Rec 6).
#
# The renovate job is inert until RENOVATE_TOKEN is set and a weekly
# pipeline schedule exists (see the P1-05 merge request). Do not put a
# token in this file.

variables:
  RUST_IMAGE: rust:1.100.0-bookworm@sha256:ade39a710ef85f3506cffcfec3e8a24ba090badef1dff2fb798f71d878833fea
  MSRV_IMAGE: rust:1.88.0-bookworm@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0
  # Keep in sync with rust-toolchain.toml. Set so jobs do not install every
  # cross target from that file; jobs that need a target still rustup target add it.
  RUSTUP_TOOLCHAIN: "1.100.0"
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # musl.cc SHA-512 from https://musl.cc/SHA512SUMS (recorded 2026-11-17).
  MUSL_CC_URL: https://musl.cc/armv7l-linux-musleabihf-cross.tgz
  MUSL_CC_SHA512: 1bb399a61da425faac521df9b8d303e60ad101f6c7827469e0b4bc685ce1f3dedc606ac7b1e8e34d79f762a3bfe3e8ab479a97e97d9f36fbd9fc5dc9d7ed6fd1
  FBINK_SHA: 886f25f13368859ad8a899b88d04c26e19cda32e
  CARGO_DENY_VERSION: "0.21.0"
  CARGO_DENY_SHA256: a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903
  # cargo-fuzz 0.13.2, Apache-2.0/MIT. sha256 of the upstream
  # cargo-fuzz-0.13.2-x86_64-unknown-linux-musl.tar.gz (recorded 2026-11-22).
  CARGO_FUZZ_VERSION: "0.13.2"
  CARGO_FUZZ_SHA256: b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c
  # Dated nightly for libFuzzer. The repo rust-toolchain.toml stays on
  # stable 1.100.0; the fuzz job selects this with `cargo +$RUST_NIGHTLY`.
  RUST_NIGHTLY: "nightly-2026-11-19"

default:
  image: $RUST_IMAGE
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TOKEN
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test
  - build
  - deps

# Regular jobs do not run on the Renovate schedule. The renovate job
# has its own rules and does not inherit these.
.regular_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.cargo_cache:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-1.100.0
    paths:
      - .cargo-home/registry/
      - .cargo-home/git/
      - target/

fmt:
  extends: .regular_rules
  stage: lint
  needs: []
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

# Fails if rust-toolchain.toml, RUST_IMAGE and RUSTUP_TOOLCHAIN drift,
# or if a cargo compile step in CI drops --locked (P1-05).
lint:pins:
  extends: .regular_rules
  stage: lint
  needs: []
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3
  script:
    - python3 scripts/check-ci-pins.py

# clippy, rustdoc, workspace tests, handwriting figures, and the 65
# emulator scripts share one job so they reuse one compile, matching
# the GitHub Actions `test` job (the GitLab runner is a single host).
test:
  stage: test
  extends:
    - .cargo_cache
    - .regular_rules
  timeout: 60 minutes
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libxkbcommon-dev pkg-config ca-certificates curl
    - rustup component add rustfmt clippy
  script:
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo doc --workspace --no-deps --locked
    - cargo test --workspace --locked
    - cargo test -q -p hwr-train --tests --locked -- --nocapture
    - rm -rf target/ci-notes target/ci-shots
    - |
      for s in tests/emu/*.script; do
        cargo run -q --release --locked --bin sigma-emu -- --script "$s" --shots target/ci-shots --notes "target/ci-notes/$(basename "$s")" || exit 1
      done
  variables:
    RUSTDOCFLAGS: -D warnings

msrv:
  extends: .regular_rules
  stage: test
  image: $MSRV_IMAGE
  # Override rust-toolchain.toml so this job stays on the MSRV.
  variables:
    RUSTUP_TOOLCHAIN: "1.88.0"
  timeout: 60 minutes
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-1.88.0
    paths:
      - .cargo-home/registry/
      - .cargo-home/git/
      - target/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libxkbcommon-dev pkg-config ca-certificates curl
  script:
    - rustc --version | grep -q '1\.88\.'
    - cargo check --workspace --all-targets --locked

.install_deny_script: &install_deny_script |
  ver="$CARGO_DENY_VERSION"
  archive="cargo-deny-${ver}-x86_64-unknown-linux-musl.tar.gz"
  url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/${archive}"
  curl -fsSL --retry 3 -o "/tmp/${archive}" "$url"
  echo "${CARGO_DENY_SHA256}  /tmp/${archive}" | sha256sum -c -
  tar -xzf "/tmp/${archive}" -C /tmp
  install -m 0755 "/tmp/cargo-deny-${ver}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/cargo-deny
  cargo deny --version

.install_fuzz_script: &install_fuzz_script |
  ver="$CARGO_FUZZ_VERSION"
  archive="cargo-fuzz-${ver}-x86_64-unknown-linux-musl.tar.gz"
  url="https://github.com/rust-fuzz/cargo-fuzz/releases/download/${ver}/${archive}"
  curl -fsSL --retry 3 -o "/tmp/${archive}" "$url"
  echo "${CARGO_FUZZ_SHA256}  /tmp/${archive}" | sha256sum -c -
  tar -xzf "/tmp/${archive}" -C /tmp
  install -m 0755 /tmp/cargo-fuzz /usr/local/bin/cargo-fuzz
  cargo fuzz --version

# A new RustSec advisory can appear without any change here, so this
# job does not block the merge request. bans / licences / sources do.
deny:advisories:
  extends: .regular_rules
  stage: lint
  needs: []
  allow_failure: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl
    - *install_deny_script
  script:
    - cargo deny check advisories

deny:bans:
  extends: .regular_rules
  stage: lint
  needs: []
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl
    - *install_deny_script
  script:
    - cargo deny check bans licenses sources

# Short cargo-fuzz smoke for the untrusted-input parsers (P3-02).
# Needs a dated nightly (libFuzzer); the repo toolchain stays on stable.
# This is a few seconds per target after the build, not a long campaign.
# The pinned cargo-fuzz binary is musl, so without an explicit GNU
# --target it builds the fuzzers for x86_64-unknown-linux-musl, which
# is not installed and is incompatible with AddressSanitizer.
fuzz:smoke:
  extends: .regular_rules
  stage: test
  needs: []
  timeout: 30 minutes
  variables:
    # Same pattern as the msrv job: override rust-toolchain.toml so
    # cargo-fuzz's inner `cargo build` uses the dated nightly.
    RUSTUP_TOOLCHAIN: "$RUST_NIGHTLY"
  cache:
    key:
      files:
        - fuzz/Cargo.lock
      prefix: rust-nightly-2026-11-19-fuzz
    paths:
      - .cargo-home/registry/
      - .cargo-home/git/
      - fuzz/target/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl clang
    - rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rust-src
    - *install_fuzz_script
  script:
    - |
      for t in plugin_api_frame plugin_api_event pluginpkg_tar settings_parse; do
        cargo +"$RUST_NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=8 -runs=256 || exit 1
      done

# Static ARMv7 musl package, including Syncthing and the CA bundle.
# Uses the pinned musl.cc gcc (checksummed) and the pinned FBInk commit,
# then scripts/package-kobo.sh (which runs check-package.sh).
package:kobo:
  extends: .regular_rules
  stage: build
  timeout: 60 minutes
  needs:
    - job: test
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-1.100.0-kobo
    paths:
      - .cargo-home/registry/
      - .cargo-home/git/
      - target/
      - .ci-tools/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential git file curl ca-certificates make pkg-config
    - rustup target add armv7-unknown-linux-musleabihf
    - ./scripts/ci-setup-kobo-toolchain.sh
  script:
    - export FBINK_DIR="${HOME}/src/FBInk"
    - ./scripts/package-kobo.sh
    - file dist/sigma-scribe-*-kobo/.adds/sigma-scribe/sigma-scribe | grep -q 'ARM.*statically linked'
  artifacts:
    name: sigma-scribe-kobo-$CI_COMMIT_SHORT_SHA
    paths:
      - dist/sigma-scribe-*-kobo.tar.gz
      - dist/sigma-scribe-*-kobo.sha256
    expire_in: 2 weeks

# Portable-crate checks (P2-04). wasm32, Android and Windows landed with
# P1-03; this adds aarch64-unknown-linux-gnu. iOS is still a follow-up:
# the instance runner is Linux amd64 and has no SDK.
check:wasm32:
  stage: test
  extends:
    - .cargo_cache
    - .regular_rules
  timeout: 30 minutes
  before_script:
    - rustup target add wasm32-unknown-unknown
  script:
    - cargo check --locked --target wasm32-unknown-unknown
        -p sigma-core -p sigma-render -p sigma-hwr
        -p sigma-plugin-api -p sigma-plugin-host

check:android:
  stage: test
  extends:
    - .cargo_cache
    - .regular_rules
  timeout: 30 minutes
  before_script:
    - rustup target add aarch64-linux-android
  script:
    # The kobo feature is off by default, so device's FBInk build.rs is skipped.
    - cargo check --locked --target aarch64-linux-android
        -p sigma-core -p sigma-render -p sigma-device

check:windows:
  stage: test
  extends:
    - .cargo_cache
    - .regular_rules
  timeout: 30 minutes
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
    - rustup target add x86_64-pc-windows-gnu
  script:
    - cargo check --locked --target x86_64-pc-windows-gnu
        -p sigma-core -p sigma-render -p sigma-hwr
        -p sigma-plugin-api -p sigma-plugin-host

check:aarch64:
  stage: test
  extends:
    - .cargo_cache
    - .regular_rules
  timeout: 30 minutes
  before_script:
    - rustup target add aarch64-unknown-linux-gnu
  script:
    # cargo check does not link, so no aarch64 C toolchain is required.
    # The kobo feature is off, so device's FBInk build.rs is skipped.
    - cargo check --locked --target aarch64-unknown-linux-gnu
        -p sigma-core -p sigma-render -p sigma-hwr
        -p sigma-plugin-api -p sigma-plugin-host -p sigma-device

# Inert until RENOVATE_TOKEN is set as a masked CI/CD variable and a
# weekly pipeline schedule is created on the default branch. This job
# is not created, scheduled, or given a token in this change (P1-05).
renovate:
  stage: deps
  image: renovate/renovate:44.249.3@sha256:68d74af05716df73410c5bd2dd8b3e6cbb0ebd21db1055d6d222e98a21d2d77a
  timeout: 30 minutes
  resource_group: renovate
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TOKEN
  variables:
    GIT_STRATEGY: none
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_AUTODISCOVER: "false"
    LOG_LEVEL: info
    FORCE_COLOR: "3"
  script:
    - renovate "$CI_PROJECT_PATH"
