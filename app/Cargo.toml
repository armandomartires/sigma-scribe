[package]
name = "sigma-scribe"
description = "Σscribe: a Markdown notebook for the Kobo Forma."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "sigma-scribe"
path = "src/main.rs"

[[bin]]
name = "sigma-emu"
path = "src/bin/sigma-emu.rs"

[features]
default = ["desktop"]
# Live minifb window (scripts/sim.sh). Mutually exclusive with `kobo`.
desktop = ["dep:minifb"]
# Kobo Forma backend (FBInk + evdev, device default paths). Build with
# --no-default-features --features kobo; see scripts/build-armv7.sh.
kobo = ["sigma-device/kobo"]

[dependencies]
sigma-app = { path = "../crates/sigma-app" }
sigma-core = { path = "../crates/core" }
sigma-render = { path = "../crates/render" }
sigma-device = { path = "../crates/device" }
minifb = { version = "0.29", optional = true, default-features = false, features = ["x11"] }

[lints]
workspace = true
