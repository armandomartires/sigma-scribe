[package]
name = "sigma-scribe"
description = "Σscribe: a Markdown notebook for the Kobo Forma."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "sigma-scribe"
path = "src/main.rs"

[[bin]]
name = "sigma-emu"
path = "src/bin/sigma-emu.rs"

[dependencies]
sigma-core = { path = "../crates/core" }
sigma-render = { path = "../crates/render" }
sigma-device = { path = "../crates/device" }
sigma-hwr = { path = "../crates/hwr" }
sigma-plugin-api = { path = "../crates/plugin-api" }
sigma-plugin-host = { path = "../crates/plugin-host" }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(not(target_arch = "arm"))'.dependencies]
minifb = { version = "0.27", default-features = false, features = ["x11"] }

[lints]
workspace = true

[dev-dependencies]
wat = "1"
