[workspace]
resolver = "2"
members = ["crates/core", "crates/plugin-api", "crates/plugin-host", "crates/render", "crates/device", "crates/hwr", "app", "tools/hwr-train"]

[workspace.package]
version = "1.11.1"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
authors = ["SIGMArecon"]

[workspace.dependencies]
png = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The recogniser and its trainer are maths-heavy; keep `cargo test`
# (debug) fast enough for the held-out check in CI.
[profile.dev.package.sigma-hwr]
opt-level = 3

[profile.dev.package.hwr-train]
opt-level = 3

# Glyph outlines and their rasteriser draw every character in the tests.
[profile.dev.package.skrifa]
opt-level = 3

[profile.dev.package.read-fonts]
opt-level = 3

[profile.dev.package.zeno]
opt-level = 3

# The WASM interpreter runs plugins (the Graph layout) inside `cargo test`;
# unoptimised it is far too slow.
[profile.dev.package.wasmi]
opt-level = 3

[profile.dev.package.wasmi_core]
opt-level = 3

[profile.dev.package.wasmi_ir]
opt-level = 3

[profile.dev.package.wasmi_collections]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3
