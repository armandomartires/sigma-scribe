[workspace]
resolver = "2"
members = ["crates/core", "crates/render", "crates/device", "app"]

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.85.1"
license = "AGPL-3.0-only"
authors = ["Sigma Recon"]

[workspace.dependencies]
fontdue = "0.9"
png = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
